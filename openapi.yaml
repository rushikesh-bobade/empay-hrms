                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/User'
                            - type: object
                              properties:
                                type: { type: string, enum: [user], description: "Category of the returned record." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/audit-logs:
    get:
      tags: [Audit]
      summary: List audit logs
      description: Requires the `admin` role.
      operationId: listAuditLogs
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: query
          description: Filter audit records by the acting user's identifier.
          schema: { type: integer }
        - name: action
          in: query
          description: Filter by an exact audited action name.
          schema: { type: string }
        - name: target_type
          in: query
          description: Filter by the affected resource type.
          schema: { type: string }
        - name: start_date
          in: query
          description: Include records created on or after this date.
          schema: { type: string, format: date }
        - name: end_date
          in: query
          description: Include records created on or before this date.
          schema: { type: string, format: date }
        - name: page
          in: query
          description: One-based results page number.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          description: Maximum number of records returned per page.
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Audit logs fetched
          content:
            application/json:
              example:
                success: true
                message: "Audit logs fetched"
                data:
                  - id: 1
                    user_id: 1
                    action: "LEAVE_APPROVED"
                    target_id: 1
                    target_type: "LEAVE_REQUEST"
                    metadata:
                      {}
                    ip_address: "203.0.113.10"
                    created_at: "2026-08-01T09:00:00.000Z"
                    full_name: "Ada Okafor"
                    email: "ada@example.com"
                total: 0
                page: 0
                totalPages: 0
              schema:
                type: object
                required: [success, message, data, total, page, totalPages]
                properties:
                  success: { type: boolean, enum: [true], description: "Indicates whether the request completed successfully." }
                  message: { type: string, description: "Message returned by the endpoint.", example: "Audit logs fetched" }
                  data:
                    description: Audit records for the current page.
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  total: { type: integer, description: "Total number of matching records." }
                  page: { type: integer, description: "Current results page." }
                  totalPages: { type: integer, description: "Total number of available pages." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Unique identifier of the requested resource.
      schema: { type: integer }
    UserId:
      name: id
      in: path
      required: true
      description: Unique integer identifier of the user.
      schema: { type: integer }
    EmployeeIdPath:
      name: employee_id
      in: path
      required: true
      description: Unique integer identifier of the employee.
      schema: { type: integer }
    EmployeeIdQuery:
      name: employee_id
      in: query
      required: false
      description: Filter results to the specified employee.
      schema: { type: integer }
    MonthQuery:
      name: month
      in: query
      schema: { type: integer, minimum: 1, maximum: 12 }
      description: Defaults to the current month.
    YearQuery:
      name: year
      in: query
      schema: { type: integer, minimum: 2000 }
      description: Defaults to the current year.
    RoleQuery:
      name: role
      in: query
      description: Filter users by their assigned access role.
      schema: { $ref: '#/components/schemas/UserRole' }
    DepartmentQuery:
      name: department
      in: query
      description: Filter results by a partial department-name match.
      schema: { type: string }
    SearchQuery:
      name: search
      in: query
      description: Search users by partial full-name or email match.
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, expired, or invalid bearer token, or invalid login credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Authenticated user lacks permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    UserRole:
      type: string
      description: Access role assigned to a user.
      enum: [admin, hr_officer, employee, payroll_officer]
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean, enum: [true], description: "Indicates whether the request completed successfully." }
        message: { type: string, description: "Message returned by the endpoint." }
    MessageResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, enum: [true], description: "Indicates whether the request completed successfully." }
        message: { type: string, description: "Message returned by the endpoint." }
    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, enum: [false], description: "Indicates whether the request completed successfully." }
        message: { type: string, description: "Message returned by the endpoint." }
        error: { type: string, description: "Underlying error detail when available." }
        hint: { type: string, description: "Suggested corrective action when available." }
    HealthResponse:
      type: object
      required: [success, message, timestamp]
      properties:
        success: { type: boolean, enum: [true], description: "Indicates whether the request completed successfully." }
        message: { type: string, description: "Message returned by the endpoint.", example: "EmPay API is running" }
        timestamp: { type: string, format: date-time, description: "Time at which the response was generated." }
    DashboardResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
          description: Indicates whether the request completed successfully.
        message:
          type: string
          description: Message returned by the endpoint.
        data:
          type: object
          description: Dashboard metrics and recent activity for the authenticated role.
          additionalProperties: true
    User:
      type: object
      properties:
        id: { type: integer, description: "Unique record identifier." }
        full_name: { type: string, description: "Full name of the user.", example: "Ada Okafor" }
        email: { type: string, format: email, description: "Email address of the user.", example: "ada@example.com" }
        role: { $ref: '#/components/schemas/UserRole' }
        department: { type: string, nullable: true, description: "Organizational department.", example: "Engineering" }
        designation: { type: string, nullable: true, description: "Employee job title.", example: "Software Engineer" }
        phone: { type: string, nullable: true, description: "Contact telephone number.", example: "+234 800 000 0000" }
        profile_pic: { type: string, nullable: true, description: "Profile-picture URL.", example: "https://cdn.example.com/avatars/ada.jpg" }
        date_joined: { type: string, format: date, description: "Date the employee joined the organization.", example: "2026-01-15" }
        is_active: { type: boolean, description: "Whether the user account is active." }
        created_at: { type: string, format: date-time, description: "Time at which the record was created." }
        updated_at: { type: string, format: date-time, description: "Time at which the record was last updated." }
    RegisterRequest:
      type: object
      required: [full_name, email, password, role]
      properties:
        full_name: { type: string, minLength: 2, maxLength: 100, description: "Full name of the user.", example: "Ada Okafor" }
        email: { type: string, format: email, maxLength: 150, description: "Email address of the user.", example: "ada@example.com" }
        password: { type: string, format: password, description: "Plain-text password submitted for authentication or account setup.", example: "Password@123" }
        role: { $ref: '#/components/schemas/UserRole' }
        department: { type: string, nullable: true, minLength: 2, maxLength: 100, description: "Organizational department.", example: "Engineering" }
        designation: { type: string, nullable: true, minLength: 2, maxLength: 100, description: "Employee job title.", example: "Software Engineer" }
        phone: { type: string, nullable: true, maxLength: 20, description: "Contact telephone number.", example: "+234 800 000 0000" }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, description: "Email address of the user.", example: "ada@example.com" }
        password: { type: string, format: password, description: "Plain-text password submitted for authentication or account setup.", example: "Password@123" }
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        full_name: { type: string, minLength: 2, maxLength: 100, description: "Full name of the user.", example: "Ada Okafor" }
        department: { type: string, minLength: 2, maxLength: 100, description: "Organizational department.", example: "Engineering" }
        designation: { type: string, minLength: 2, maxLength: 100, description: "Employee job title.", example: "Software Engineer" }
        phone: { type: string, maxLength: 20, description: "Contact telephone number.", example: "+234 800 000 0000" }
        profile_pic: { type: string, description: "Profile-picture URL.", example: "https://cdn.example.com/avatars/ada.jpg" }
        role: { $ref: '#/components/schemas/UserRole' }
        password: { type: string, format: password, description: "Plain-text password submitted for authentication or account setup.", example: "Password@123" }
    AttendanceRecord:
      type: object
      properties:
        id: { type: integer, description: "Unique record identifier." }
        employee_id: { type: integer, description: "Identifier of the employee." }
        date: { type: string, format: date, description: "Calendar date of the attendance record.", example: "2026-07-31" }
        check_in: { type: string, nullable: true, description: "Most recent check-in time.", example: "09:00:00" }
        check_out: { type: string, nullable: true, description: "Most recent check-out time.", example: "17:00:00" }
        accumulated_minutes: { type: integer, description: "Minutes accumulated during earlier attendance sessions that day." }
        duration_minutes: { type: integer, nullable: true, description: "Total calculated attendance duration in minutes." }
        status: { type: string, enum: [present, absent, half_day, on_leave, unpaid_leave], description: "Current status of the record." }
        created_at: { type: string, format: date-time, description: "Time at which the record was created." }
        full_name: { type: string, description: "Full name of the user.", example: "Ada Okafor" }
        email: { type: string, format: email, description: "Email address of the user.", example: "ada@example.com" }
        department: { type: string, nullable: true, description: "Organizational department.", example: "Engineering" }
        designation: { type: string, nullable: true, description: "Employee job title.", example: "Software Engineer" }
        profile_pic: { type: string, nullable: true, description: "Profile-picture URL.", example: "https://cdn.example.com/avatars/ada.jpg" }
    AttendanceSummary:
      type: object
      properties:
        present: { type: string, description: PostgreSQL count value }
        absent: { type: string, description: PostgreSQL count value }
        half_day: { type: string, description: PostgreSQL count value }
        on_leave: { type: string, description: PostgreSQL count value }
        total_working_days: { type: string, description: PostgreSQL count value }
    LeaveType:
      type: object
      properties:
        id: { type: integer, description: "Unique record identifier." }
        name: { type: string, description: "Display name.", example: "Annual Leave" }
        description: { type: string, nullable: true, description: "Additional explanatory text.", example: "Paid annual leave" }
        max_days_per_year: { type: integer, description: "Maximum leave days allowed per year." }
        is_paid: { type: boolean, description: "Whether the leave type is paid." }
    LeaveAllocation:
      type: object
      properties:
        id: { type: integer, description: "Unique record identifier." }
        employee_id: { type: integer, description: "Identifier of the employee." }
        leave_type_id: { type: integer, description: "Identifier of the leave type." }
        allocated_days: { type: integer, description: "Number of leave days allocated." }
        used_days: { type: integer, description: "Number of allocated leave days already used." }
        year: { type: integer, description: "Calendar year.", example: 2026 }
        name: { type: string, description: "Display name.", example: "Annual Leave" }
        max_days_per_year: { type: integer, description: "Maximum leave days allowed per year." }
        remaining: { type: integer, description: "Number of allocated leave days still available." }
    LeaveRequest:
      type: object
      properties:
        id: { type: integer, description: "Unique record identifier." }
        employee_id: { type: integer, description: "Identifier of the employee." }
        leave_type_id: { type: integer, description: "Identifier of the leave type." }
        start_date: { type: string, format: date, description: "First date of the leave period.", example: "2026-08-10" }
        end_date: { type: string, format: date, description: "Last date of the leave period.", example: "2026-08-14" }
        total_days: { type: integer, description: "Number of working days in the leave request." }
        reason: { type: string, nullable: true, description: "Reason supplied for the leave request.", example: "Family event" }
        status: { type: string, enum: [pending, approved, rejected], description: "Current status of the record." }
        reviewed_by: { type: integer, nullable: true, description: "Identifier of the user who reviewed the request." }
        reviewed_at: { type: string, format: date-time, nullable: true, description: "Time at which the request was reviewed." }
        created_at: { type: string, format: date-time, description: "Time at which the record was created." }
        leave_type_name: { type: string, description: "Display name of the leave type." }
        full_name: { type: string, description: "Full name of the user.", example: "Ada Okafor" }
        email: { type: string, format: email, description: "Email address of the user.", example: "ada@example.com" }
        department: { type: string, nullable: true, description: "Organizational department.", example: "Engineering" }
        designation: { type: string, nullable: true, description: "Employee job title.", example: "Software Engineer" }
        reviewer_name: { type: string, nullable: true, description: "Full name of the reviewer." }
    SalaryStructureRequest:
      type: object
      description: Salary values assigned to an employee.
      required: [employee_id, basic_salary]
      properties:
        employee_id: { type: integer, description: "Identifier of the employee." }
        basic_salary: { type: number, format: double, exclusiveMinimum: true, minimum: 0, description: "Employee base salary before additions and deductions.", example: 250000 }
        hra_percent: { type: number, format: double, minimum: 0, maximum: 100, default: 40, description: "Housing allowance percentage." }
        special_allowance: { type: number, format: double, minimum: 0, default: 0, description: "Fixed special-allowance amount." }
        effective_from: { type: string, format: date, description: "Date from which the salary structure applies.", example: "2026-08-01" }
    SalaryStructure:
      description: Persisted salary structure with employee details.
      allOf:
        - $ref: '#/components/schemas/SalaryStructureRequest'
        - type: object
          description: Database and employee fields added to the salary values.
          properties:
            id: { type: integer, description: "Unique record identifier." }
            created_at: { type: string, format: date-time, description: "Time at which the record was created." }
            full_name: { type: string, description: "Full name of the user.", example: "Ada Okafor" }
            email: { type: string, format: email, description: "Email address of the user.", example: "ada@example.com" }
            department: { type: string, nullable: true, description: "Organizational department.", example: "Engineering" }
            designation: { type: string, nullable: true, description: "Employee job title.", example: "Software Engineer" }
    Payrun:
      type: object
      properties:
        id: { type: integer, description: "Unique record identifier." }
        month: { type: integer, minimum: 1, maximum: 12, description: "Calendar month number from 1 to 12.", example: 7 }
        year: { type: integer, description: "Calendar year.", example: 2026 }
        status: { type: string, enum: [draft, finalized], description: "Current status of the record." }
        generated_by: { type: integer, nullable: true, description: "Identifier of the user who generated the pay run." }
        generated_at: { type: string, format: date-time, description: "Time at which the pay run was generated." }
        generated_by_name: { type: string, nullable: true, description: "Full name of the pay-run generator." }
        total_cost: { type: string, nullable: true, description: PostgreSQL numeric aggregate }
        employee_count: { type: string, description: PostgreSQL count value }
    Payslip:
      type: object
      properties:
        id: { type: integer, description: "Unique record identifier." }
        payrun_id: { type: integer, description: "Identifier of the pay run." }
        employee_id: { type: integer, description: "Identifier of the employee." }
        working_days: { type: integer, description: "Number of working days in the pay period." }
        present_days: { type: string, description: PostgreSQL numeric value }
        leaves_approved: { type: integer, description: "Number of approved leave days." }
        unpaid_leave_days: { type: integer, description: "Number of unpaid leave days." }
        unpaid_deduction: { type: string, description: "Salary amount deducted for unpaid leave." }
        basic: { type: string, description: "Effective basic salary for the pay period." }
        hra: { type: string, description: "Housing allowance amount." }
        special_allowance: { type: string, description: "Fixed special-allowance amount." }
        gross_salary: { type: string, description: "Total earnings before deductions." }
        pf_employee: { type: string, description: "Employee provident-fund contribution." }
        pf_employer: { type: string, description: "Employer provident-fund contribution." }
        professional_tax: { type: string, description: "Professional tax deducted." }
        total_deductions: { type: string, description: "Combined deductions for the pay period." }
        net_pay: { type: string, description: "Final salary after deductions." }
        created_at: { type: string, format: date-time, description: "Time at which the record was created." }
        month: { type: integer, description: "Calendar month number from 1 to 12.", example: 7 }
        year: { type: integer, description: "Calendar year.", example: 2026 }
        payrun_status: { type: string, description: "Status of the associated pay run." }
        full_name: { type: string, description: "Full name of the user.", example: "Ada Okafor" }
        email: { type: string, format: email, description: "Email address of the user.", example: "ada@example.com" }
        department: { type: string, nullable: true, description: "Organizational department.", example: "Engineering" }
        designation: { type: string, nullable: true, description: "Employee job title.", example: "Software Engineer" }
        date_joined: { type: string, format: date, description: "Date the employee joined the organization.", example: "2026-01-15" }
        user_id: { type: integer, description: "Identifier of the associated user." }
    Notification:
      type: object
      properties:
        id: { type: integer, description: "Unique record identifier." }
        user_id: { type: integer, description: "Identifier of the associated user." }
        title: { type: string, description: "Notification title.", example: "Leave request approved" }
        message: { type: string, description: "Notification content.", example: "Today's attendance summary is available" }
        type: { type: string, description: "Category of the returned record." }
        is_read: { type: boolean, description: "Whether the notification has been read." }
        created_at: { type: string, format: date-time, description: "Time at which the record was created." }
    Settings:
      type: object
      additionalProperties: true
      description: Dynamic key/value application settings.
      example:
        company_name: EmPay Ltd
        company_email: hr@example.com
        timezone: Africa/Lagos
        work_start_time: '09:00'
        work_end_time: '17:00'
    AuditLog:
      type: object
      properties:
        id: { type: integer, format: int64, description: "Unique record identifier." }
        user_id: { type: integer, description: "Identifier of the associated user." }
        action: { type: string, description: "Action performed by the operation or recorded audit event.", example: "LEAVE_APPROVED" }
        target_id: { type: integer, format: int64, description: "Identifier of the affected resource." }
        target_type: { type: string, description: "Type of resource affected by the action.", example: "LEAVE_REQUEST" }
        metadata: { type: object, nullable: true, additionalProperties: true, description: "Additional structured details about the audited action." }
        ip_address: { type: string, description: "Client IP address recorded for the action.", example: "203.0.113.10" }
        created_at: { type: string, format: date-time, description: "Time at which the record was created." }
        full_name: { type: string, nullable: true, description: "Full name of the user.", example: "Ada Okafor" }
        email: { type: string, format: email, nullable: true, description: "Email address of the user.", example: "ada@example.com" }
