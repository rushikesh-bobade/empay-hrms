openapi: 3.0.3
info:
  title: EmPay HRMS API
  version: 1.0.0
  description: |
    REST API contract derived from the Express routes, controllers, services, and
    database schema. Protected operations require the `Authorization: Bearer <JWT>`
    request header. Individual operation descriptions identify additional role
    restrictions.
  contact:
    name: EmPay Support
    email: support@empay.com
servers:
  - url: http://localhost:5000
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Attendance
  - name: Leave
  - name: Payroll
  - name: Dashboard
  - name: Notifications
  - name: Settings
  - name: Search
  - name: Audit

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Check API health
      operationId: getHealth
      responses:
        '200':
          description: API is running
          content:
            application/json:
              example:
                success: true
                message: "EmPay API is running"
                timestamp: "2026-08-01T09:00:00.000Z"
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      description: Requires the `admin` or `hr_officer` role.
      operationId: registerUser
      security:
        - bearerAuth: []
      requestBody:
        description: Payload supplied to this operation.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              full_name: Ada Okafor
              email: ada@example.com
              password: Password@123
              role: employee
              department: Engineering
              designation: Software Engineer
              phone: '+234 800 000 0000'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              example:
                success: true
                message: "User registered successfully"
                data:
                  id: 1
                  full_name: "Ada Okafor"
                  email: "ada@example.com"
                  role: "admin"
                  department: "Engineering"
                  designation: "Software Engineer"
                  phone: "+234 800 000 0000"
                  profile_pic: "https://cdn.example.com/avatars/ada.jpg"
                  date_joined: "2026-01-15"
                  is_active: true
                  created_at: "2026-08-01T09:00:00.000Z"
                  updated_at: "2026-08-01T09:00:00.000Z"
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Email already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      operationId: login
      requestBody:
        description: Payload supplied to this operation.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: employee@example.com
              password: Password@123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              example:
                success: true
                message: "Login successful"
                data:
                  token: "string"
                  user:
                    id: 1
                    full_name: "Ada Okafor"
                    email: "ada@example.com"
                    role: "admin"
                    department: "Engineering"
                    designation: "Software Engineer"
                    phone: "+234 800 000 0000"
                    profile_pic: "https://cdn.example.com/avatars/ada.jpg"
                    date_joined: "2026-01-15"
                    is_active: true
                    created_at: "2026-08-01T09:00:00.000Z"
                    updated_at: "2026-08-01T09:00:00.000Z"
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [token, user]
                        properties:
                          token: { type: string, description: Signed JWT }
                          user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user's profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile fetched
          content:
            application/json:
              example:
                success: true
                message: "Profile fetched successfully"
                data:
                  id: 1
                  full_name: "Ada Okafor"
                  email: "ada@example.com"
                  role: "admin"
                  department: "Engineering"
                  designation: "Software Engineer"
                  phone: "+234 800 000 0000"
                  profile_pic: "https://cdn.example.com/avatars/ada.jpg"
                  date_joined: "2026-01-15"
                  is_active: true
                  created_at: "2026-08-01T09:00:00.000Z"
                  updated_at: "2026-08-01T09:00:00.000Z"
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset
      operationId: forgotPassword
      requestBody:
        description: Payload supplied to this operation.
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, description: "Email address of the user.", example: "ada@example.com" }
            example:
              email: employee@example.com
      responses:
        '200':
          description: Generic success response, whether or not the account exists
          content:
            application/json:
              example:
                success: true
                message: "If an account exists, a reset link has been sent"
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset a password
      operationId: resetPassword
      requestBody:
        description: Payload supplied to this operation.
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, description: "Password-reset token received by email.", example: "reset-token-from-email" }
                newPassword: { type: string, format: password, description: "New password to assign to the account.", example: "NewPassword@123" }
            example:
              token: reset-token-from-email
              newPassword: NewPassword@123
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              example:
                success: true
                message: "Password reset successfully"
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/test-email:
    post:
      tags: [Auth]
      summary: Send an SMTP test email
      description: Requires the `admin` role. If `email` is omitted, the authenticated user's email is used.
      operationId: testEmail
      security:
        - bearerAuth: []
      requestBody:
        description: Payload supplied to this operation.
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, description: "Email address of the user.", example: "ada@example.com" }
            example:
              email: admin@example.com
      responses:
        '200':
          description: Test email sent
          content:
            application/json:
              example:
                success: true
                message: "Test email sent successfully! Check your inbox."
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users:
    get:
      tags: [Users]
      summary: List users
      description: Available to all authenticated roles.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleQuery'
        - $ref: '#/components/parameters/DepartmentQuery'
        - $ref: '#/components/parameters/SearchQuery'
        - name: is_active
          in: query
          schema: { type: boolean }
          description: Filter by active status.
      responses:
        '200':
          description: Users fetched
          content:
            application/json:
              example:
                success: true
                message: "Users fetched successfully"
                data:
                  - id: 1
                    full_name: "Ada Okafor"
                    email: "ada@example.com"
                    role: "admin"
                    department: "Engineering"
                    designation: "Software Engineer"
                    phone: "+234 800 000 0000"
                    profile_pic: "https://cdn.example.com/avatars/ada.jpg"
                    date_joined: "2026-01-15"
                    is_active: true
                    created_at: "2026-08-01T09:00:00.000Z"
                    updated_at: "2026-08-01T09:00:00.000Z"
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/me/avatar:
    post:
      tags: [Users]
      summary: Upload the authenticated user's avatar
      operationId: uploadAvatar
      security:
        - bearerAuth: []
      requestBody:
        description: Payload supplied to this operation.
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
                  description: JPG, JPEG, PNG, or WebP image, maximum 5 MB.
      responses:
        '200':
          description: Profile picture updated
          content:
            application/json:
              example:
                success: true
                message: "Profile picture updated"
                data:
                  profile_pic: "https://cdn.example.com/avatars/ada.jpg"
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          profile_pic: { type: string, format: uri, nullable: true, description: "Profile-picture URL.", example: "https://cdn.example.com/avatars/ada.jpg" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get a user
      description: Employees may only view their own profile.
      operationId: getUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User fetched
          content:
            application/json:
              example:
                success: true
                message: "User fetched successfully"
                data:
                  id: 1
                  full_name: "Ada Okafor"
                  email: "ada@example.com"
                  role: "admin"
                  department: "Engineering"
                  designation: "Software Engineer"
                  phone: "+234 800 000 0000"
                  profile_pic: "https://cdn.example.com/avatars/ada.jpg"
                  date_joined: "2026-01-15"
                  is_active: true
                  created_at: "2026-08-01T09:00:00.000Z"
                  updated_at: "2026-08-01T09:00:00.000Z"
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Users]
      summary: Update a user
      description: Employees and payroll officers may update only themselves; HR officers may update themselves or employees; only admins may change `role` or `password`.
      operationId: updateUser
      security:
        - bearerAuth: []
      requestBody:
        description: Payload supplied to this operation.
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
            example:
              full_name: Ada Okafor
              department: Engineering
              designation: Senior Software Engineer
              phone: '+234 800 000 0000'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              example:
                success: true
                message: "User updated successfully"
                data:
                  id: 1
                  full_name: "Ada Okafor"
                  email: "ada@example.com"
                  role: "admin"
                  department: "Engineering"
                  designation: "Software Engineer"
                  phone: "+234 800 000 0000"
                  profile_pic: "https://cdn.example.com/avatars/ada.jpg"
                  date_joined: "2026-01-15"
                  is_active: true
                  created_at: "2026-08-01T09:00:00.000Z"
                  updated_at: "2026-08-01T09:00:00.000Z"
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Users]
      summary: Deactivate a user
      description: Requires the `admin` role. This is a soft delete that sets `is_active` to false.
      operationId: deleteUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User deactivated
          content:
            application/json:
              example:
                success: true
                message: "User deactivated successfully"
                data:
                  id: 1
                  full_name: "Ada Okafor"
                  email: "ada@example.com"
                  role: "admin"
                  department: "Engineering"
                  designation: "Software Engineer"
                  phone: "+234 800 000 0000"
                  profile_pic: "https://cdn.example.com/avatars/ada.jpg"
                  date_joined: "2026-01-15"
                  is_active: true
                  created_at: "2026-08-01T09:00:00.000Z"
                  updated_at: "2026-08-01T09:00:00.000Z"
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/{id}/toggle-active:
    patch:
      tags: [Users]
      summary: Toggle a user's active status
      description: Requires the `admin` role.
      operationId: toggleUserActive
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User status toggled
          content:
            application/json:
              example:
                success: true
                message: "User activated successfully"
                data:
                  id: 1
                  full_name: "Ada Okafor"
                  email: "ada@example.com"
                  role: "admin"
                  department: "Engineering"
                  designation: "Software Engineer"
                  phone: "+234 800 000 0000"
                  profile_pic: "https://cdn.example.com/avatars/ada.jpg"
                  date_joined: "2026-01-15"
                  is_active: true
                  created_at: "2026-08-01T09:00:00.000Z"
                  updated_at: "2026-08-01T09:00:00.000Z"
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/attendance/mark:
    post:
      tags: [Attendance]
      summary: Check in or check out
      description: Marks attendance for the authenticated user. Repeated calls alternate between check-in and check-out behavior.
      operationId: markAttendance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Attendance marked
          content:
            application/json:
              example:
                success: true
                message: "Successfully checked in"
                data:
                  action: "checked_in"
                  record:
                    id: 1
                    employee_id: 1
                    date: "2026-07-31"
                    check_in: "09:00:00"
                    check_out: "17:00:00"
                    accumulated_minutes: 0
                    duration_minutes: null
                    status: "present"
                    created_at: "2026-08-01T09:00:00.000Z"
                    full_name: "Ada Okafor"
                    email: "ada@example.com"
                    department: "Engineering"
                    designation: "Software Engineer"
                    profile_pic: "https://cdn.example.com/avatars/ada.jpg"
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          action: { type: string, enum: [checked_in, checked_out], description: "Attendance action performed by this request.", example: "checked_in" }
                          record: { $ref: '#/components/schemas/AttendanceRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/attendance/my:
    get:
      tags: [Attendance]
      summary: Get the authenticated user's monthly attendance
      operationId: getMyAttendance
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MonthQuery'
        - $ref: '#/components/parameters/YearQuery'
      responses:
        '200':
          description: Attendance fetched
          content:
            application/json:
              example:
                success: true
                message: "Attendance fetched"
                data:
                  - id: 1
                    employee_id: 1
                    date: "2026-07-31"
                    check_in: "09:00:00"
                    check_out: "17:00:00"
                    accumulated_minutes: 0
                    duration_minutes: null
                    status: "present"
                    created_at: "2026-08-01T09:00:00.000Z"
                    full_name: "Ada Okafor"
                    email: "ada@example.com"
                    department: "Engineering"
                    designation: "Software Engineer"
                    profile_pic: "https://cdn.example.com/avatars/ada.jpg"
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AttendanceRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/attendance/monthly-summary:
    get:
      tags: [Attendance]
      summary: Get a monthly attendance summary
      description: Defaults to the authenticated user when `employee_id` is omitted.
      operationId: getMonthlyAttendanceSummary
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EmployeeIdQuery'
        - $ref: '#/components/parameters/MonthQuery'
        - $ref: '#/components/parameters/YearQuery'
      responses:
        '200':
          description: Summary fetched
          content:
            application/json:
              example:
                success: true
                message: "Summary fetched"
                data:
                  present: "string"
                  absent: "string"
                  half_day: "string"
                  on_leave: "string"
                  total_working_days: "string"
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AttendanceSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/attendance/all:
    get:
      tags: [Attendance]
      summary: List monthly attendance for all employees
      description: Requires the `admin`, `hr_officer`, or `payroll_officer` role.
      operationId: listAllAttendance
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MonthQuery'
        - $ref: '#/components/parameters/YearQuery'
        - $ref: '#/components/parameters/DepartmentQuery'
        - $ref: '#/components/parameters/EmployeeIdQuery'
      responses:
        '200':
          description: Attendance fetched
          content:
            application/json:
              example:
                success: true
                message: "All attendance fetched"
                data:
                  - id: 1
                    employee_id: 1
                    date: "2026-07-31"
                    check_in: "09:00:00"
                    check_out: "17:00:00"
                    accumulated_minutes: 0
                    duration_minutes: null
                    status: "present"
                    created_at: "2026-08-01T09:00:00.000Z"
                    full_name: "Ada Okafor"
                    email: "ada@example.com"
                    department: "Engineering"
                    designation: "Software Engineer"
                    profile_pic: "https://cdn.example.com/avatars/ada.jpg"
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AttendanceRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/attendance/today:
    get:
      tags: [Attendance]
      summary: List today's attendance
      description: Requires the `admin`, `hr_officer`, or `payroll_officer` role.
      operationId: getTodayAttendance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Today's attendance fetched
          content:
            application/json:
              example:
                success: true
                message: "Today attendance fetched"
                data:
                  - id: 1
                    employee_id: 1
                    date: "2026-07-31"
                    check_in: "09:00:00"
                    check_out: "17:00:00"
                    accumulated_minutes: 0
                    duration_minutes: null
                    status: "present"
                    created_at: "2026-08-01T09:00:00.000Z"
                    full_name: "Ada Okafor"
                    email: "ada@example.com"
                    department: "Engineering"
                    designation: "Software Engineer"
                    profile_pic: "https://cdn.example.com/avatars/ada.jpg"
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AttendanceRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/leave/types:
    get:
      tags: [Leave]
      summary: List leave types
      operationId: listLeaveTypes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Leave types fetched
          content:
            application/json:
              example:
                success: true
                message: "Leave types fetched"
                data:
                  - id: 1
                    name: "Annual Leave"
                    description: "Paid annual leave"
                    max_days_per_year: 0
                    is_paid: true
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LeaveType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
