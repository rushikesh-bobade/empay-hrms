      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
          description: Search text matched against name, email, department, and designation.
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
