        '500': { $ref: '#/components/responses/ServerError' }

  /api/admin/audit-logs:
    get:
      tags: [Audit]
      summary: List audit logs
      description: Requires the `admin` role.
      operationId: listAuditLogs
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: query
          schema: { type: integer }
        - name: action
          in: query
          schema: { type: string }
        - name: target_type
          in: query
          schema: { type: string }
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Audit logs fetched
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, total, page, totalPages]
                properties:
                  success: { type: boolean, enum: [true] }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  total: { type: integer }
                  page: { type: integer }
                  totalPages: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    EmployeeIdPath:
      name: employee_id
      in: path
      required: true
      schema: { type: integer }
    EmployeeIdQuery:
      name: employee_id
      in: query
      required: false
      schema: { type: integer }
    MonthQuery:
      name: month
      in: query
      schema: { type: integer, minimum: 1, maximum: 12 }
      description: Defaults to the current month.
    YearQuery:
      name: year
      in: query
      schema: { type: integer, minimum: 2000 }
      description: Defaults to the current year.
    RoleQuery:
      name: role
      in: query
      schema: { $ref: '#/components/schemas/UserRole' }
    DepartmentQuery:
      name: department
      in: query
      schema: { type: string }
    SearchQuery:
      name: search
      in: query
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, expired, or invalid bearer token, or invalid login credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Authenticated user lacks permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    DashboardSuccess:
      description: Dashboard data fetched
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessResponse'
              - type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true

  schemas:
    UserRole:
      type: string
      enum: [admin, hr_officer, employee, payroll_officer]
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
    MessageResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, enum: [false] }
        message: { type: string }
        error: { type: string }
        hint: { type: string }
    HealthResponse:
      type: object
      required: [success, message, timestamp]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        timestamp: { type: string, format: date-time }
    User:
      type: object
      properties:
        id: { type: integer }
        full_name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        department: { type: string, nullable: true }
        designation: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        profile_pic: { type: string, nullable: true }
        date_joined: { type: string, format: date }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RegisterRequest:
      type: object
      required: [full_name, email, password, role]
      properties:
        full_name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 150 }
        password: { type: string, format: password }
        role: { $ref: '#/components/schemas/UserRole' }
        department: { type: string, nullable: true, minLength: 2, maxLength: 100 }
        designation: { type: string, nullable: true, minLength: 2, maxLength: 100 }
        phone: { type: string, nullable: true, maxLength: 20 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        full_name: { type: string, minLength: 2, maxLength: 100 }
        department: { type: string, minLength: 2, maxLength: 100 }
        designation: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: string, maxLength: 20 }
        profile_pic: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        password: { type: string, format: password }
    AttendanceRecord:
      type: object
      properties:
        id: { type: integer }
        employee_id: { type: integer }
        date: { type: string, format: date }
        check_in: { type: string, nullable: true }
        check_out: { type: string, nullable: true }
        accumulated_minutes: { type: integer }
        duration_minutes: { type: integer, nullable: true }
        status: { type: string, enum: [present, absent, half_day, on_leave, unpaid_leave] }
        created_at: { type: string, format: date-time }
        full_name: { type: string }
        email: { type: string, format: email }
        department: { type: string, nullable: true }
        designation: { type: string, nullable: true }
        profile_pic: { type: string, nullable: true }
    AttendanceSummary:
      type: object
      properties:
        present: { type: string, description: PostgreSQL count value }
        absent: { type: string, description: PostgreSQL count value }
        half_day: { type: string, description: PostgreSQL count value }
        on_leave: { type: string, description: PostgreSQL count value }
        total_working_days: { type: string, description: PostgreSQL count value }
    LeaveType:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        max_days_per_year: { type: integer }
        is_paid: { type: boolean }
    LeaveAllocation:
      type: object
      properties:
        id: { type: integer }
        employee_id: { type: integer }
        leave_type_id: { type: integer }
        allocated_days: { type: integer }
        used_days: { type: integer }
        year: { type: integer }
        name: { type: string }
        max_days_per_year: { type: integer }
        remaining: { type: integer }
    LeaveRequest:
      type: object
      properties:
        id: { type: integer }
        employee_id: { type: integer }
        leave_type_id: { type: integer }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        total_days: { type: integer }
        reason: { type: string, nullable: true }
        status: { type: string, enum: [pending, approved, rejected] }
        reviewed_by: { type: integer, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        leave_type_name: { type: string }
        full_name: { type: string }
        email: { type: string, format: email }
        department: { type: string, nullable: true }
        designation: { type: string, nullable: true }
        reviewer_name: { type: string, nullable: true }
    SalaryStructureRequest:
      type: object
      required: [employee_id, basic_salary]
      properties:
        employee_id: { type: integer }
        basic_salary: { type: number, format: double, exclusiveMinimum: true, minimum: 0 }
        hra_percent: { type: number, format: double, minimum: 0, maximum: 100, default: 40 }
        special_allowance: { type: number, format: double, minimum: 0, default: 0 }
        effective_from: { type: string, format: date }
    SalaryStructure:
      allOf:
        - $ref: '#/components/schemas/SalaryStructureRequest'
        - type: object
          properties:
            id: { type: integer }
            created_at: { type: string, format: date-time }
            full_name: { type: string }
            email: { type: string, format: email }
            department: { type: string, nullable: true }
            designation: { type: string, nullable: true }
    Payrun:
      type: object
      properties:
        id: { type: integer }
        month: { type: integer, minimum: 1, maximum: 12 }
        year: { type: integer }
        status: { type: string, enum: [draft, finalized] }
        generated_by: { type: integer, nullable: true }
        generated_at: { type: string, format: date-time }
        generated_by_name: { type: string, nullable: true }
        total_cost: { type: string, nullable: true, description: PostgreSQL numeric aggregate }
        employee_count: { type: string, description: PostgreSQL count value }
    Payslip:
      type: object
      properties:
        id: { type: integer }
        payrun_id: { type: integer }
        employee_id: { type: integer }
        working_days: { type: integer }
        present_days: { type: string, description: PostgreSQL numeric value }
        leaves_approved: { type: integer }
        unpaid_leave_days: { type: integer }
        unpaid_deduction: { type: string }
        basic: { type: string }
        hra: { type: string }
        special_allowance: { type: string }
