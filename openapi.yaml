openapi: 3.0.3
info:
  title: EmPay HRMS API
  version: 1.0.0
  description: |
    REST API contract derived from the Express routes, controllers, services, and
    database schema. Protected operations require the `Authorization: Bearer <JWT>`
    request header. Individual operation descriptions identify additional role
    restrictions.
servers:
  - url: http://localhost:5000
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Attendance
  - name: Leave
  - name: Payroll
  - name: Dashboard
  - name: Notifications
  - name: Settings
  - name: Search
  - name: Audit

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Check API health
      operationId: getHealth
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      description: Requires the `admin` or `hr_officer` role.
      operationId: registerUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              full_name: Ada Okafor
              email: ada@example.com
              password: Password@123
              role: employee
              department: Engineering
              designation: Software Engineer
              phone: '+234 800 000 0000'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Email already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: employee@example.com
              password: Password@123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [token, user]
                        properties:
                          token: { type: string, description: Signed JWT }
                          user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user's profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile fetched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
            example:
              email: employee@example.com
      responses:
        '200':
          description: Generic success response, whether or not the account exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset a password
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, format: password }
            example:
              token: reset-token-from-email
              newPassword: NewPassword@123
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/auth/test-email:
    post:
      tags: [Auth]
      summary: Send an SMTP test email
      description: Requires the `admin` role. If `email` is omitted, the authenticated user's email is used.
      operationId: testEmail
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
            example:
              email: admin@example.com
      responses:
        '200':
          description: Test email sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users:
    get:
      tags: [Users]
      summary: List users
      description: Available to all authenticated roles.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleQuery'
        - $ref: '#/components/parameters/DepartmentQuery'
        - $ref: '#/components/parameters/SearchQuery'
        - name: is_active
          in: query
          schema: { type: boolean }
          description: Filter by active status.
      responses:
        '200':
          description: Users fetched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/me/avatar:
    post:
      tags: [Users]
      summary: Upload the authenticated user's avatar
      operationId: uploadAvatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
                  description: JPG, JPEG, PNG, or WebP image, maximum 5 MB.
      responses:
        '200':
          description: Profile picture updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          profile_pic: { type: string, format: uri, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get a user
      description: Employees may only view their own profile.
      operationId: getUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User fetched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Users]
      summary: Update a user
      description: Employees and payroll officers may update only themselves; HR officers may update themselves or employees; only admins may change `role` or `password`.
      operationId: updateUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
            example:
              full_name: Ada Okafor
              department: Engineering
              designation: Senior Software Engineer
              phone: '+234 800 000 0000'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Users]
      summary: Deactivate a user
      description: Requires the `admin` role. This is a soft delete that sets `is_active` to false.
      operationId: deleteUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User deactivated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/users/{id}/toggle-active:
    patch:
      tags: [Users]
      summary: Toggle a user's active status
      description: Requires the `admin` role.
      operationId: toggleUserActive
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User status toggled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/attendance/mark:
    post:
      tags: [Attendance]
      summary: Check in or check out
      description: Marks attendance for the authenticated user. Repeated calls alternate between check-in and check-out behavior.
      operationId: markAttendance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Attendance marked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          action: { type: string, enum: [checked_in, checked_out] }
                          record: { $ref: '#/components/schemas/AttendanceRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/attendance/my:
    get:
      tags: [Attendance]
      summary: Get the authenticated user's monthly attendance
      operationId: getMyAttendance
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MonthQuery'
        - $ref: '#/components/parameters/YearQuery'
      responses:
        '200':
          description: Attendance fetched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AttendanceRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/attendance/monthly-summary:
    get:
      tags: [Attendance]
      summary: Get a monthly attendance summary
      description: Defaults to the authenticated user when `employee_id` is omitted.
      operationId: getMonthlyAttendanceSummary
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EmployeeIdQuery'
        - $ref: '#/components/parameters/MonthQuery'
        - $ref: '#/components/parameters/YearQuery'
      responses:
        '200':
          description: Summary fetched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AttendanceSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/attendance/all:
    get:
      tags: [Attendance]
      summary: List monthly attendance for all employees
      description: Requires the `admin`, `hr_officer`, or `payroll_officer` role.
      operationId: listAllAttendance
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MonthQuery'
        - $ref: '#/components/parameters/YearQuery'
        - $ref: '#/components/parameters/DepartmentQuery'
        - $ref: '#/components/parameters/EmployeeIdQuery'
      responses:
        '200':
          description: Attendance fetched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AttendanceRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/attendance/today:
    get:
      tags: [Attendance]
      summary: List today's attendance
      description: Requires the `admin`, `hr_officer`, or `payroll_officer` role.
      operationId: getTodayAttendance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Today's attendance fetched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AttendanceRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/leave/types:
    get:
      tags: [Leave]
      summary: List leave types
      operationId: listLeaveTypes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Leave types fetched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LeaveType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Leave]
      summary: Create a leave type
      description: Requires the `admin` role.
      operationId: createLeaveType
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, max_days_per_year]
              properties:
                name: { type: string, minLength: 2 }
                description: { type: string, nullable: true }
                max_days_per_year: { type: integer, minimum: 0, maximum: 365 }
            example:
              name: Annual Leave
              description: Paid annual leave
              max_days_per_year: 20
      responses:
        '201':
          description: Leave type created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LeaveType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/leave/allocation/my:
    get:
      tags: [Leave]
      summary: Get the authenticated user's leave allocations
      description: The route is intended to use the authenticated user but currently passes a missing path parameter to the service.
      operationId: getMyLeaveAllocations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Allocations fetched when the route implementation is corrected
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LeaveAllocation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/leave/allocation/{employee_id}:
    get:
      tags: [Leave]
      summary: Get an employee's leave allocations
      description: Requires the `admin` or `hr_officer` role.
      operationId: getEmployeeLeaveAllocations
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EmployeeIdPath'
      responses:
        '200':
          description: Allocations fetched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LeaveAllocation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/leave/allocation:
    post:
      tags: [Leave]
      summary: Create or update a leave allocation
      description: Requires the `admin` or `hr_officer` role.
      operationId: upsertLeaveAllocation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_id, leave_type_id, allocated_days]
              properties:
                employee_id: { type: integer }
                leave_type_id: { type: integer }
                allocated_days: { type: integer, minimum: 0 }
                year: { type: integer, minimum: 2000 }
            example:
              employee_id: 42
              leave_type_id: 1
              allocated_days: 20
              year: 2026
      responses:
        '200':
          description: Allocation saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LeaveAllocation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/leave/request:
    post:
      tags: [Leave]
      summary: Submit a leave request
      operationId: createLeaveRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leave_type_id, start_date, end_date]
              properties:
                leave_type_id: { type: integer }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                reason: { type: string, minLength: 5, nullable: true }
            example:
              leave_type_id: 1
              start_date: '2026-08-10'
              end_date: '2026-08-14'
              reason: Family event
      responses:
        '201':
          description: Leave request submitted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LeaveRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/leave/requests/my:
    get:
      tags: [Leave]
      summary: List the authenticated user's leave requests
      operationId: listMyLeaveRequests
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Requests fetched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LeaveRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/leave/requests/all:
    get:
      tags: [Leave]
      summary: List all leave requests
      description: Requires the `admin`, `hr_officer`, or `payroll_officer` role.
      operationId: listAllLeaveRequests
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
        - $ref: '#/components/parameters/EmployeeIdQuery'
      responses:
        '200':
          description: Requests fetched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LeaveRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/leave/requests/{id}/approve:
    patch:
      tags: [Leave]
      summary: Approve a leave request
      description: Requires the `payroll_officer` role.
      operationId: approveLeaveRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Leave approved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LeaveRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/leave/requests/{id}/reject:
    patch:
      tags: [Leave]
      summary: Reject a leave request
      description: Requires the `payroll_officer` role.
      operationId: rejectLeaveRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Leave rejected
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LeaveRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/payroll/salary-structure:
    post:
      tags: [Payroll]
      summary: Create or update a salary structure
      description: Requires the `admin` or `payroll_officer` role.
      operationId: upsertSalaryStructure
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaryStructureRequest'
            example:
              employee_id: 42
              basic_salary: 250000
